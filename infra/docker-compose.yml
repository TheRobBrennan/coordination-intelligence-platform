# Full local dev stack for the Coordination Intelligence Platform PoC.
# Everything runs in containers — the only thing you install on your machine is
# Docker Desktop. Latest stable versions, pinned: Neo4j 2026.05, Keycloak 26.6,
# Postgres 18, Python 3.14, Node 24.17.0 LTS, pnpm 11.8.0 — all in these images
# and the per-app Dockerfiles, so the host stays clean.
# All images are multi-arch and run natively on Apple Silicon (arm64) and x86.
#
#   neo4j     — graph DB (browser at http://localhost:7474)
#   keycloak  — auth / roles / accounts (admin console at http://localhost:8080)
#   kc-postgres — keycloak's backing store
#   api       — FastAPI read API (http://localhost:8000), hot-reload via bind mount
#   web       — Next.js UI (http://localhost:3000) — behind the "web" profile;
#               enable once apps/web is scaffolded:  docker compose --profile web up
services:
  neo4j:
    image: neo4j:2026.05-community
    container_name: cip-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  kc-postgres:
    image: postgres:18-alpine
    container_name: cip-kc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - kc_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: cip-keycloak
    command: start-dev --import-realm
    depends_on:
      - kc-postgres
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      # Realm + seed users (Rob, Kathy, …) imported on startup. See infra/keycloak.
      - ./keycloak:/opt/keycloak/data/import:ro

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    container_name: cip-api
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # In-container service names (not localhost) — overrides .env host values.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devpassword}
      NEO4J_DATABASE: neo4j
      API_CORS_ORIGINS: http://localhost:3000
      # macOS bind-mount file events can be missed — poll so --reload is reliable.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../apps/api:/app           # live source for hot reload
      # Keep the container's venv (built at /opt/venv) out of the bind mount.

  web:
    profiles: ["web"]              # only starts with: docker compose --profile web up
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    container_name: cip-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"    # reliable Next.js hot reload over macOS bind mounts
    volumes:
      - ../apps/web:/app
      - /app/node_modules          # anonymous volume — don't let host shadow deps

volumes:
  neo4j_data:
  kc_postgres_data:
