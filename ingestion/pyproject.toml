[project]
name = "cxc-ingest"
version = "0.1.0"
description = "CXC PoC ingestion: scrape org sites, extract topics via LLM, load into Neo4j"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "neo4j>=5.23",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    # openai optional — only needed when LLM_PROVIDER=openai|azure_openai
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
